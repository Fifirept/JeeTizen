<div class="modal fade" id="settingsModal" tabindex="-1" role="dialog" aria-labelledby="settingsModalLabel">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="settingsModalLabel">Advanced Settings</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <form>
          <div class="form-group">
            <label for="keyDelay">Key Delay (ms):</label>
            <input type="number" class="form-control" id="keyDelay" name="keyDelay" min="100" max="5000" placeholder="300">
          </div>
          <div class="form-group">
            <label for="delayRetour">Delay Return Source (ms):</label>
            <input type="number" class="form-control" id="delayRetour" name="delayRetour" min="500" max="10000" placeholder="3000">
          </div>
          <div class="form-group">
            <label for="sourceRetour">Return Source After Zap:</label>
            <select class="form-control" id="sourceRetour" name="sourceRetour">
              <option value="">Stay on TNT</option>
              <option value="HDMI1">HDMI 1</option>
              <option value="HDMI2">HDMI 2</option>
              <option value="HDMI3">HDMI 3</option>
              <option value="HDMI4">HDMI 4</option>
            </select>
          </div>
          <div class="form-group">
            <label for="logLevel">Log Level:</label>
            <select class="form-control" id="logLevel" name="logLevel">
              <option value="100">Default</option>
              <option value="200">Info</option>
              <option value="300">Warning</option>
              <option value="400">Error</option>
              <option value="1000">Debug</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary" id="saveSettingsBtn">Save Changes</button>
      </div>
    </div>
  </div>
</div>
