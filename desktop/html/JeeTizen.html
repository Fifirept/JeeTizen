<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipment Configuration Interface</title>
</head>
<body>
    <h1>Equipment Configuration Interface</h1>
    <form id="configForm">
        <label for="ip">IP Address:</label>
        <input type="text" id="ip" name="ip" required><br><br>
        <label for="port">Port:</label>
        <input type="number" id="port" name="port" required><br><br>
        <label for="ssl">SSL:</label>
        <select id="ssl" name="ssl">
            <option value="true">Enabled</option>
            <option value="false">Disabled</option>
        </select><br><br>
        <label for="token">Token:</label>
        <input type="text" id="token" name="token" required><br><br>
        <input type="submit" value="Submit">
    </form>
    <h2>Commands Table</h2>
    <table border="1">
        <tr>
            <th>Command</th>
            <th>Description</th>
        </tr>
        <tr>
            <td>Start</td>
            <td>Starts the equipment</td>
        </tr>
        <tr>
            <td>Stop</td>
            <td>Stops the equipment</td>
        </tr>
        <tr>
            <td>Restart</td>
            <td>Restarts the equipment</td>
        </tr>
    </table>
</body>
</html>
